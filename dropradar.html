<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b0c"><title>DropRadar</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><style>html,body{margin:0;background:#090b0c;color:#fff;font-family:system-ui}#boot{min-height:100vh;display:grid;place-items:center;text-align:center}b{color:#c9ff32}button{font:inherit}.bootBtn{padding:10px 14px;border:0;border-radius:10px;font-weight:800}.pwaFab{position:fixed;z-index:9999;right:16px;width:46px;height:46px;border-radius:50%;border:1px solid #364044;background:#111416;color:#dce2e4;box-shadow:0 10px 30px #0008;display:grid;place-items:center;font-size:19px;cursor:pointer}.pwaFab.on{background:#c9ff32;color:#090b0c;border-color:#c9ff32}.pwaFab.push{bottom:16px}.pwaFab.install{bottom:70px;display:none}.pwaToast{position:fixed;z-index:10000;right:16px;bottom:128px;max-width:320px;background:#121719;border:1px solid #354044;color:#e5eaec;border-radius:12px;padding:12px 14px;display:none;font-size:12px;line-height:1.4}.pwaToast.show{display:block}</style></head><body><div id="boot"><div><h1><b>DROP</b>RADAR</h1><p>Loading v0.7…</p></div></div><script>
const LIVE='https://dropradar-cloud.vercel.app';
const USER='https://ngpfglowsaxmsfdryuev.supabase.co/functions/v1/dropradar-user';
const DATA='https://ngpfglowsaxmsfdryuev.supabase.co/functions/v1/dropradar-api';
const CACHE_KEY='dropradar_v07_shell';
function pwaLayer(){return `<button class="pwaFab install" id="pwaInstall" title="Install DropRadar">＋</button><button class="pwaFab push" id="pwaPush" title="Personal alerts">🔔</button><div class="pwaToast" id="pwaToast"></div><script>(()=>{const USER='${USER}',DATA='${DATA}';let installPrompt=null;const $p=s=>document.querySelector(s);function msg(ru,de,en){const l=(localStorage.getItem('dropradar_lang')||document.documentElement.lang||navigator.language||'en').toLowerCase();return l.startsWith('ru')?ru:l.startsWith('de')?de:en}function toast(s){const e=$p('#pwaToast');if(!e)return;e.textContent=s;e.classList.add('show');clearTimeout(window.__pwaToast);window.__pwaToast=setTimeout(()=>e.classList.remove('show'),3500)}function bytes(v){const pad='='.repeat((4-v.length%4)%4),raw=atob((v+pad).replace(/-/g,'+').replace(/_/g,'/')),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out}function cloudKey(){let k=localStorage.getItem('dropradar_cloud_key');if(k)return k;const b=new Uint8Array(32);crypto.getRandomValues(b);let s='';b.forEach(x=>s+=String.fromCharCode(x));k=btoa(s).replace(/\\+/g,'-').replace(/\\//g,'_').replace(/=+$/,'');localStorage.setItem('dropradar_cloud_key',k);return k}function prefs(){try{return JSON.parse(localStorage.getItem('dropradar_preferences')||'{}')}catch{return{}}}async function sw(){await navigator.serviceWorker.register('./sw.js');return navigator.serviceWorker.ready}function state(){const b=$p('#pwaPush');if(!b)return;const on=localStorage.getItem('dropradar_alerts')==='1'&&'Notification'in window&&Notification.permission==='granted';b.classList.toggle('on',on)}async function toggle(){if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window)){toast(msg('Push не поддерживается','Push wird nicht unterstützt','Push is not supported'));return}const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;if(ios&&!standalone){toast(msg('Сначала добавь DropRadar на экран «Домой», затем открой его оттуда и включи уведомления.','Füge DropRadar zuerst zum Home-Bildschirm hinzu, öffne es von dort und aktiviere dann Benachrichtigungen.','Add DropRadar to your Home Screen first, open it from there, then enable alerts.'));return}try{const reg=await sw(),existing=await reg.pushManager.getSubscription();if(existing&&localStorage.getItem('dropradar_alerts')==='1'){await Promise.allSettled([fetch(USER+'?action=unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:existing.endpoint})}),fetch(DATA+'?action=unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:existing.endpoint})})]);await existing.unsubscribe();localStorage.setItem('dropradar_alerts','0');state();toast(msg('Уведомления выключены','Benachrichtigungen deaktiviert','Alerts disabled'));return}const permission=await Notification.requestPermission();if(permission!=='granted'){toast(msg('Браузер не разрешил уведомления','Browser hat Benachrichtigungen blockiert','Browser did not allow notifications'));return}const cfg=await fetch(USER+'?action=config',{cache:'no-store'}).then(r=>r.json());if(!cfg?.vapidPublicKey)throw Error('VAPID unavailable');const sub=existing||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes(cfg.vapidPublicKey)});const lang=(localStorage.getItem('dropradar_lang')||'en').slice(0,2);const r=await fetch(USER+'?action=subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub.toJSON(),lang,cloudKey:cloudKey(),preferences:prefs(),silent:false})}),d=await r.json();if(!r.ok||!d?.ok)throw Error(d?.error||'subscribe failed');localStorage.setItem('dropradar_alerts','1');state();toast(msg('Персональные уведомления включены','Persönliche Benachrichtigungen aktiv','Personal alerts enabled'))}catch(e){console.error(e);toast(msg('Не удалось включить push','Push konnte nicht aktiviert werden','Could not enable push'))}}$p('#pwaPush')?.addEventListener('click',toggle);window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;const b=$p('#pwaInstall');if(b)b.style.display='grid'});$p('#pwaInstall')?.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$p('#pwaInstall').style.display='none'});window.addEventListener('appinstalled',()=>{$p('#pwaInstall').style.display='none';toast(msg('DropRadar установлен','DropRadar installiert','DropRadar installed'))});sw().catch(()=>{});state()})()<\/script>`}
(async()=>{try{const r=await fetch(LIVE,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let h=await r.text();localStorage.setItem(CACHE_KEY,h);h=h.replace('</head>','<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"></head>').replace('</body>',pwaLayer()+'</body>');document.open();document.write(h);document.close()}catch(e){const old=localStorage.getItem(CACHE_KEY);if(old){const h=old.replace('</head>','<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"></head>').replace('</body>',pwaLayer()+'</body>');document.open();document.write(h);document.close();return}document.getElementById('boot').innerHTML='<div><h1><b>DROP</b>RADAR</h1><p>Live feed is temporarily unavailable.</p><button class="bootBtn" onclick="location.reload()">Retry</button></div>'}})();
</script></body></html>
